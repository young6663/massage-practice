<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>首頁｜乙級上岸練習</title>
<link rel="stylesheet" href="assets/css/base.css" />
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>
<header class="site-header">
  <p class="site-name">乙級上岸練習</p>
  <p class="whoami">目前身份：<span id="whoami-name">尚未選擇</span>｜<a href="who.html" class="link-action">切換<span class="vh">身份</span></a></p>
  <nav class="main-nav" aria-label="主要導覽">
    <ul>
      <li><a href="index.html" aria-current="page">首頁</a></li>
      <li><a href="all.html">40題總表</a></li>
      <li><a href="weak.html">我的弱題</a></li>
      <li><a href="draw.html">模擬抽題</a></li>
      <li><a href="group.html">群組</a></li>
    </ul>
  </nav>
</header>
<main id="main" tabindex="-1">
  <h1>首頁</h1>
  <p id="status" class="status" role="status"></p>
  <p id="loading" class="field-hint">資料載入中…</p>
  <div id="error" class="error" role="alert"></div>

  <div id="no-identity-notice" hidden>
    <p>你還沒有選擇身份，請先<a href="who.html">選擇你是誰</a>，才能看到今天的練習內容。</p>
  </div>

  <div id="home-content" hidden>
    <section id="today-section">
      <h2 id="today-heading">今天：<span id="today-label"></span></h2>
      <p id="today-remaining"></p>
      <p><a id="today-day-link" href="day.html" class="link-action">前往選題<span class="vh" id="today-day-link-vh"></span></a></p>
    </section>

    <section id="next-step-section">
      <h2>下一步</h2>
      <p id="next-step-message"></p>
      <p id="next-step-link-wrap"></p>
    </section>

    <section id="my-selections-section">
      <h2>我的選題</h2>
      <p id="my-selections-round"></p>
      <div id="my-selections-days"></div>
    </section>

    <section id="my-weak-section">
      <h2>我的弱題</h2>
      <div id="my-weak-list"></div>
      <p><a href="weak.html" class="link-action">查看全部弱題</a></p>
    </section>

    <section id="all-days-section">
      <h2>所有題組</h2>
      <ul id="all-days-list"></ul>
    </section>

    <section id="other-tools-section">
      <h2>其他練習工具</h2>
      <p><a id="acupoint-link" href="#" class="link-action">前往經穴背誦教練</a></p>
    </section>
  </div>
</main>
<script type="module" src="assets/js/pages/home.js"></script>
</body>
</html>
